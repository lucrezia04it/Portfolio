<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio - Lucrezia Longo</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.0/css/all.min.css">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/contact.css">
</head>
<body class="page-contact">
    <div class="menu-overlay">
        <!-- Placeholder Navbar -->
        <div id="navbar-placeholder"></div>
            <main class="contact-hero">
                <!-- Intestazione principale -->
                <div class="contact-title-container">
                    <h1>So, what's next?</h1>
                    <p>Have an idea, a project, or just something interesting to talk about?</p>
                </div>

                <!-- Contenitore a due colonne (Let's Talk + Form Box) -->
                <div class="contact-content-wrapper">
                    
                    <!-- Colonna di sinistra -->
                    <div class="contact-left">
                        <h2 class="lets-talk-title">LET'S TALK</h2>
                        <!-- Eventuale linea o decorazione sotto "LET'S TALK" -->
                    </div>

                    <!-- Colonna di destra: Il Box del Form -->
                    <div class="contact-card">
                        <form action="https://formspree.io/f/mzepwwgg" method="POST" class="contact-form">
                            <div class="form-group">
                                <input type="text" name="name" placeholder="Name" required>
                            </div>
                            <div class="form-group">
                                <input type="email" name="email" placeholder="E-mail" required>
                            </div>
                            <div class="form-group">
                                <textarea name="message" rows="4" placeholder="Tell me a little about it" required></textarea>
                            </div>
                            <button type="submit" class="submit-btn">Send</button>
                        </form>
                    </div>

                    

                </div>
                <div class="thanks">
                    <h2>Thk u👉👈​</h2>
                </div>
            </main>
    </div>
        <!-- Placeholder Footer dinamico -->
        <div id="footer-placeholder"></div>

        <!-- Scripts -->
        <script src="../javaScript/componenti.js"></script>
    </body>
</html>
